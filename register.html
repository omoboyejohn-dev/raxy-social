<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - RAXY SOCIAL</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h1>📝 Create Your Account</h1>

        <p>
            Continue with your Google account to access
            <strong>RAXY SOCIAL</strong>.
        </p>

        <button class="google-btn" onclick="googleSignIn()">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
                width="22"
                height="22">

            Continue with Google

        </button>

        <br><br>

        <a href="index.html" class="back-home">
            ⬅️ Back to Home
        </a>

    </div>

</div>

<script>

function googleSignIn(){

    alert("Google Sign-In will be connected with Firebase Authentication.");

}

</script>

</body>
</html>
