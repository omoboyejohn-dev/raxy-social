<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RAXY SOCIAL</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🔑 Welcome Back</h1>

        <p>Log in to your RAXY SOCIAL account</p>

        <form>

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                placeholder="Password"
                required>

            <button type="submit">
                Log In
            </button>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

</body>
